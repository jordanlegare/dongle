name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile and run tests with default FIPS feature
        run: cargo test --all-targets
      - name: Check UEFI stage formatting
        run: cargo fmt --manifest-path uefi-stage/Cargo.toml -- --check
      - name: Install UEFI target
        run: rustup target add x86_64-unknown-uefi
      - name: Build pre-OS UEFI application
        run: cargo build --manifest-path uefi-stage/Cargo.toml --target x86_64-unknown-uefi --release
